<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">   
    <link rel="stylesheet" href="style.css">
    <title>Cálculo de tiempo</title>
</head>
<body>
    <main class="container py-3">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card tarjeta">
                    <div class="card-body">
                        <h1 class="card-title titulo text-center">Cálculo de tiempo</h1>
                        <form id="tiempoForm" novalidate>
                            <fieldset class="mt-4">
                                <legend class="subtitulos">Hora inicial</legend>
                                <div class="row g-2">
                                    <div class="col-4">
                                        <label class="titulotiempo" for="horaInicial">Hora</label>
                                        <input type="number" id="horaInicial" min="0" max="23" class="form-control" placeholder="00" required>
                                    </div>
                                    <div class="col-4">
                                        <label class="titulotiempo" for="minutoInicial">Minutos</label>
                                        <input type="number" id="minutoInicial" min="0" max="59" class="form-control" placeholder="00" required>
                                    </div>
                                    <div class="col-4">
                                        <label class="titulotiempo" for="segundoInicial">Segundos</label>
                                        <input type="number" id="segundoInicial" min="0" max="59" class="form-control" placeholder="00" required>
                                    </div>
                                </div>
                            </fieldset>

                            <fieldset class="mt-4">
                                <legend class="subtitulos">Hora final</legend>
                                <div class="row g-2">
                                    <div class="col-4">
                                        <label class="titulotiempo" for="horaFinal">Hora</label>
                                        <input type="number" id="horaFinal" min="0" max="23" class="form-control" placeholder="00" required>
                                    </div>
                                    <div class="col-4">
                                        <label class="titulotiempo" for="minutoFinal">Minutos</label>
                                        <input type="number" id="minutoFinal" min="0" max="59" class="form-control" placeholder="00" required>
                                    </div>
                                    <div class="col-4">
                                        <label class="titulotiempo" for="segundoFinal">Segundos</label>
                                        <input type="number" id="segundoFinal" min="0" max="59" class="form-control" placeholder="00" required>
                                    </div>
                                </div>
                            </fieldset>

                            <div class="text-center mt-3">
                                <button type="submit" class="btn btn-outline-success">Calcular</button>
                            </div>

                            <fieldset class="mt-4">
                                <legend class="subtitulos">Resultado</legend>
                                <div class="row g-2">
                                    <div class="col-4">
                                        <label class="titulotiempo" for="resultadoHoras">Horas</label>
                                        <input type="number" id="resultadoHoras" class="form-control" placeholder="00" readonly>
                                    </div>
                                    <div class="col-4">
                                        <label class="titulotiempo" for="resultadoMinutos">Minutos</label>
                                        <input type="number" id="resultadoMinutos" class="form-control" placeholder="00" readonly>
                                    </div>
                                    <div class="col-4">
                                        <label class="titulotiempo" for="resultadoSegundos">Segundos</label>
                                        <input type="number" id="resultadoSegundos" class="form-control" placeholder="00" readonly>
                                    </div>
                                </div>
                            </fieldset>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    
     <script src="codigo.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
